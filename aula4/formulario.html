<!DOCTYPE html> 
<html lang="pt-BR"> 
<head> 
<link rel="stylesheet" href="css/formulario.css">
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, 
initial-scale=1.0"> 
<title>Formulário de Cadastro</title> 
</head> 
<body> 
<h1>Formulário de Cadastro</h1> 
<form> 
<label for="nome">Nome completo:</label> 
<input type="text" id="nome" name="nome" required> 
<br><br> 
<label for="email">E-mail:</label> 
        <input type="email" id="email" name="email" required> 
        <br><br> 
 
        <label for="telefone">Telefone:</label> 
        <input 
            type="tel" 
            id="telefone" 
            name="telefone" 
            pattern="[0-9]{2} [0-9]{5}-[0-9]{4}" 
            placeholder="11 99999-9999"> 
        <br><br> 
 
        <label for="nascimento">Data de nascimento:</label> 
        <input type="date" id="nascimento" name="nascimento"> 
        <br><br> 
 
        <label for="senha">Senha:</label> 
        <input 
            type="password" 
            id="senha" 
            name="senha" 
            minlength="6" 
            required> 
        <br><br> 
 
        <button type="submit">Cadastrar</button> 
    </form> 
 
    <script> 
        const nome = document.getElementById("nome"); 
        const email = document.getElementById("email"); 
        const telefone = document.getElementById("telefone"); 
        const senha = document.getElementById("senha"); 
 
        nome.addEventListener("invalid", function () { 
            if (nome.validity.valueMissing) { 
                nome.setCustomValidity("Por favor, preencha o nome completo."); 
            } 
        }); 
 
        nome.addEventListener("input", function () { 
            nome.setCustomValidity(""); 
        }); 
 
        email.addEventListener("invalid", function () { 
            if (email.validity.valueMissing) { 
                email.setCustomValidity("Por favor, preencha o e-mail."); 
            } else if (email.validity.typeMismatch) { 
                email.setCustomValidity("Digite um e-mail válido."); 
            } 
        }); 
 
        email.addEventListener("input", function () { 
            email.setCustomValidity(""); 
        }); 
 
        telefone.addEventListener("invalid", function () { 
            if (telefone.validity.patternMismatch) { 
                telefone.setCustomValidity( 
                    "Digite o telefone no formato: 11 99999-9999." 
                ); 
            } 
        }); 
 
        telefone.addEventListener("input", function () { 
            telefone.setCustomValidity(""); 
        }); 
 
        senha.addEventListener("invalid", function () { 
            if (senha.validity.valueMissing) { 
                senha.setCustomValidity("Por favor, preencha a senha."); 
            } else if (senha.validity.tooShort) { 
                senha.setCustomValidity( 
                    "A senha deve ter pelo menos 6 caracteres." 
                ); 
            } 
        }); 
 
        senha.addEventListener("input", function () { 
            senha.setCustomValidity(""); 
        }); 
    </script> 
 
</body> 
</html>
